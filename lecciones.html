, aceptando que un corte puede perder hasta un minuto de cambios."}, {"tipo": "h", "txt": "4. Guardar los datos fuera del pendrive del sistema"}, {"tipo": "p", "txt": "Los archivos de los PVC, del registry y de las bases viven en una partición aparte del pendrive. Así, reinstalar Fedora o rehacer el cluster no borra los datos: se vuelven a montar y los servicios los encuentran."}, {"tipo": "nota", "tono": "red", "t": "Qué pasa al apagar con /scripts/apagar.sh todos", "txt": "El script detiene los servicios de forma ordenada y **vacía las escrituras pendientes** antes de apagar. Eso es lo que protege los archivos subidos por SFTP, Samba y NFS: si se retira el pendrive sin apagar, la caché sin volcar se pierde o el sistema de archivos queda inconsistente."}], "clave": ["hostNetwork: SIP anuncia IPs, si NAT las cambia se corta el audio", "Swap off: las garantías de memoria se calculan sobre memoria real", "noatime: leer no debe escribir en el flash. Apagar con script: vuelca la caché"], "trampa": "En hostNetwork, olvidar el costo: sin aislamiento y con choque de puertos. Y en swap, decir \"para que ande más rápido\" en lugar de \"para que las garantías de memoria sean confiables\".", "parcial": "Es el bloque de preguntas más rentable del laboratorio: cuatro \"por qué\" que suelen aparecer casi textuales."}, {"id": "l27", "t": "Archivos en red y servicios del laboratorio", "min": 14, "banco": "Laboratorio de Kubernetes", "resumen": "SFTP, Samba y NFS resuelven lo mismo por caminos distintos. Y Gitea, GitLab y Uptime Kuma muestran que el cluster no es solo para web.", "cuerpo": [{"tipo": "tabla", "cab": ["", "SFTP", "Samba 4", "NFSv4"], "filas": [["Sobre qué protocolo", "SSH, en un único canal TCP cifrado", "SMB/CIFS, el protocolo nativo de Windows", "El protocolo NFS, estándar de UNIX"], ["Cómo autentica", "Usuario y contraseña, o clave, igual que SSH", "Usuario y contraseña de dominio, o acceso de invitado", "Controla la máquina y su UID/GID: confía en el cliente"], [" const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

}

/* ============ LECCIÓN ============ */
function leccion(el){
  const l = porId[params.id] || TODAS[0];
  const mod = l.mod;
  const idx = mod.lecciones.findIndex(x=>x.id===l.id);
  const ant = idx>0 ? mod.lecciones[idx-1] : null;
  const sig = idx<mod.lecciones.length-1 ? mod.lecciones[idx+1] : null;
  const leido = !!S.leido[l.id];

  el.innerHTML = `
  <div class="lecg">
    <div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <span class="pill ${mod.peso===1?'red':mod.peso===2?'gold':'teal'}">${mesc(mod.titulo)}</span>
        <span class="pill gray">Lección ${idx+1} de ${mod.lecciones.length}</span>
        <span class="pill blue">${l.min} min</span>
        ${leido? '<span class="pill teal">✓ leída</span>':''}
      </div>
      <article class="leccion" id="lecbox">
        <h2>${md(l.t)}</h2>
        <div class="resumen">${md(l.resumen)}</div>
        ${l.cuerpo.map(pieza).join('')}
        <div class="clavebox">
          <div class="eyebrow" style="margin-bottom:8px">Para poder decirlo de memoria</div>
          <ul style="margin:0;padding-left:20px">${l.clave.map(c=>`<li>${md(c)}</li>`).join('')}</ul>
        </div>
        <div class="nota red"><div class="t">La trampa de examen</div>${md(l.trampa)}</div>
        <div class="nota blue" style="margin-bottom:0"><div class="t">Cómo aparece en el parcial</div>${md(l.parcial)}</div>
      </article>

      <div class="btnrow" style="margin-top:14px">
        <button class="btn ${leido?'':'primary'}" id="bLeido">${leido? '✓ Leída · desmarcar' : 'Marcar como leída'}</button>
        <a class="btn ghost" href="./index.html">Abrir la app de preguntas</a>
      </div>
      <div class="lecnav">
        ${ant? `<button class="btn" data-go="${ant.id}">${IC.prev} ${md(ant.t.split(':')[0])}</button>`:'<span></span>'}
        ${sig? `<button class="btn primary" data-go="${sig.id}">${md(sig.t.split(':')[0])} ${IC.next}</button>`:''}
      </div>
    </div>

    <div class="toc">
      <div class="eyebrow" style="margin-bottom:8px">${mesc(mod.titulo)}</div>
      ${mod.lecciones.map((x,i)=>`
        <button class="tocitem ${x.id===l.id?'on':''} ${S.leido[x.id]?'read':''}" data-toc="${x.id}">
          <span class="st"></span>
          <span style="flex:1">${i+1}. ${md(x.t.split(':')[0])}</span>
        </button>`).join('')}
      <hr class="sep" style="margin:12px 0">
      <div class="tiny muted" style="padding:0 9px; line-height:1.5">${mesc(mod.porQue)}</div>
    </div>
  </div>`;

  el.querySelector('#bLeido').onclick = ()=>{
    S.leido[l.id] = !S.leido[l.id]; guardar();
    if(S.leido[l.id]) toast('Lección marcada. La próxima es la de abajo.');
    render();
  };
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=> ir('leccion',{id:b.dataset.go}));
  el.querySelectorAll('[data-toc]').forEach(b=>b.onclick=()=> ir('leccion',{id:b.dataset.toc}));
}
function mesc(s){ return esc(s); }
function pieza(p){
  if(p.tipo==='p') return `<p>${md(p.txt)}</p>`;
  if(p.tipo==='h') return `<h4>${md(p.txt)}</h4>`;
  if(p.tipo==='lista') return `<ul>${p.items.map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
  if(p.tipo==='tabla') return `<div style="overflow-x:auto"><table><thead><tr>${p.cab.map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead>
    <tbody>${p.filas.map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(p.tipo==='codigo') return `<pre>${esc(p.txt)}</pre>`;
  if(p.tipo==='nota') return `<div class="nota ${p.tono||'blue'}"><div class="t">${md(p.t)}</div>${md(p.txt)}</div>`;
  return '';
}

function progreso(el){
  const t = totales();
  const bloques = Object.values(S.bloques).filter(Boolean).length;
  const totalBloques = PLAN.flatMap(d=>d.bloques).length;
  const checklist = [
    {ok: t.ok>=Math.ceil(t.tot*0.5), txt:'Leíste al menos la mitad de las lecciones'},
    {ok: MODS.filter(m=>m.peso===1).every(m=>m.lecciones.every(l=>S.leido[l.id])), txt:'Completaste los cuatro temas de peso alto'},
    {ok: bloques>=totalBloques-2, txt:'Cumpliste casi todos los bloques del plan'},
    {ok: t.ok===t.tot, txt:`Leíste las ${N} lecciones`}
  ];
  el.innerHTML = `
  <div class="eyebrow">Panel</div>
  <h1 class="h1">Progreso</h1>
  <p class="lead" style="margin-top:8px">Todo se guarda en este navegador. Si cambiás de equipo, el progreso no viaja: es solo de acá.</p>

  <div class="grid g3" style="margin-top:16px">
    <div class="stat"><div class="n">${t.ok}<small>/${t.tot}</small></div><div class="l">lecciones leídas</div></div>
    <div class="stat"><div class="n">${bloques}<small>/${totalBloques}</small></div><div class="l">bloques del plan</div></div>
    <div class="stat"><div class="n">${pct(t.ok,t.tot)}%</div><div class="l">del material</div></div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="eyebrow">Por tema</div>
    ${MODS.map(m=>{
      const r = m.lecciones.filter(l=>S.leido[l.id]).length;
      return `<div style="padding:10px 0;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
          <b style="font-size:14.4px">${esc(m.titulo)}</b>
          <span class="tiny muted">${r}/${m.lecciones.length}</span>
        </div>
        <div style="margin-top:6px">${barra(pct(r,m.lecciones.length), r===m.lecciones.length?'teal':'')}</div>
      </div>`;
    }).join('')}
  </div>

  <div class="card">
    <div class="eyebrow">¿Estás listo?</div>
    <div style="margin-top:8px">
      ${checklist.map(c=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:7px 0">
        <span class="check ${c.ok?'on':''}" style="pointer-events:none">${IC.check}</span>
        <span class="small" style="${c.ok?'':'color:#5A6B7E'}">${c.txt}</span></div>`).join('')}
    </div>
    <div class="nota ${checklist.every(c=>c.ok)?'teal':'gold'}" style="margin-bottom:0">
      <div class="t">${checklist.every(c=>c.ok)?'Listo':'Todavía no'}</div>
      ${checklist.every(c=>c.ok)
        ? 'Terminaste el material. Ahora lo único que rinde es hacer simulacros completos con tiempo en el banco de preguntas.'
        : 'Lo que falta es lectura, no fuerza de voluntad: seguí por donde quedaste y no saltees los temas de peso alto.'}
    </div>
  </div>

  <div class="card">
    <div class="eyebrow">Siguiente paso</div>
    <div class="btnrow">
      <button class="btn primary" id="bSeg">Seguir con la próxima lección</button>
      <a class="btn" href="./index.html">Abrir la app de preguntas</a>
      <button class="btn ghost" id="bReset">Reiniciar progreso</button>
    </div>
  </div>`;
  el.querySelector('#bSeg').onclick = ()=>{ const n = TODAS.find(l=>!S.leido[l.id]); ir('leccion',{id:(n||TODAS[0]).id}); };
  el.querySelector('#bReset').onclick = ()=>{
    if(!confirm('¿Borrar el progreso de lecciones y del plan?')) return;
    S = {leido:{}, bloques:{}, ultima:null, vista:'inicio'}; guardar(); ir('inicio'); toast('Progreso borrado');
  };
}

ir(vista);
</script>
